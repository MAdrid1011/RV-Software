[binaries]
c = ['clang', '--target=riscv32-unknown-elf', '-march=rv32imf_zicsr_zicntr', '-mabi=ilp32f']
ar = 'llvm-ar'
strip = 'llvm-strip'

[host_machine]
system = 'none'
cpu_family = 'riscv32'
cpu = 'riscv32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O3', '-ffp-contract=off', '-fno-vectorize', '-fno-slp-vectorize']
c_link_args = ['-nostdlib', '-fuse-ld=lld']
